<mat-form-field class="search-input">
  <mat-label>Search super hero</mat-label>
  <input
    matInput
    type="text"
    [(ngModel)]="searchValue"
    placeholder="Serch super heroe by name..."
  />
  @if (searchValue()) {
    <button matSuffix matIconButton aria-label="Clear" (click)="searchValue.set('')">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
