<h2 mat-dialog-title align="center">Delete Hero: {{ data.superHeroName }}</h2>
<mat-dialog-content> Are you sure you want to delete this hero? </mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancel</button>
  <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial>Confirm</button>
</mat-dialog-actions>
